<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sudoku Studio</title>
  <style>
    :root {
      --app-bg: #f6f4ef;
      --panel-bg: #fbfaf8;
      --grid-line: #2b2a28;
      --button-bg: #1f2937;
      --button-fg: #f9fafb;
      --entry-bg: #ffffff;
      --text-primary: #111827;
      --text-muted: #374151;
      --border: #d6d3cd;
      --user-cell: #ffa500;
      --solved-cell: #32cd32;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: radial-gradient(circle at top right, #ece8df 0%, var(--app-bg) 55%);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 1.25rem;
    }

    .app-shell {
      width: min(900px, 100%);
      background: transparent;
      animation: rise-in 320ms ease-out;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 3.6vw, 2.2rem);
      letter-spacing: 0.02em;
    }

    .subtitle {
      margin: 0.35rem 0 0;
      color: var(--text-muted);
    }

    .panel {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 0.85rem;
      margin-top: 0.95rem;
      box-shadow: 0 10px 28px rgba(31, 41, 55, 0.08);
    }

    .controls {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .controls label {
      font-size: 0.92rem;
      color: var(--text-muted);
    }

    select,
    button,
    input {
      font: inherit;
    }

    select {
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 10px;
      padding: 0.4rem 0.55rem;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 0.48rem 0.78rem;
      background: var(--button-bg);
      color: var(--button-fg);
      cursor: pointer;
      font-weight: 600;
      transition: transform 120ms ease, opacity 120ms ease;
    }

    button:hover {
      transform: translateY(-1px);
      opacity: 0.94;
    }

    .board-wrap {
      display: grid;
      place-items: center;
      padding: 0.25rem;
      overflow-x: auto;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      gap: 2px;
      background: var(--grid-line);
      border: 2px solid var(--grid-line);
      border-radius: 10px;
      width: min(620px, 100%);
      aspect-ratio: 1 / 1;
      min-width: 320px;
    }

    .cell {
      border: 0;
      text-align: center;
      font-size: clamp(1rem, 2.2vw, 1.45rem);
      font-weight: 700;
      color: var(--text-primary);
      background: var(--entry-bg);
      width: 100%;
      height: 100%;
      outline: none;
    }

    .cell:focus {
      box-shadow: inset 0 0 0 2px #111827;
      z-index: 2;
      position: relative;
    }

    .thick-right {
      box-shadow: inset -2px 0 0 var(--grid-line);
    }

    .thick-bottom {
      box-shadow: inset 0 -2px 0 var(--grid-line);
    }

    .status {
      margin-top: 0.85rem;
      color: var(--text-muted);
      min-height: 1.4rem;
    }

    @keyframes rise-in {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <h1 id="title"></h1>
    <p id="subtitle" class="subtitle"></p>

    <section class="panel">
      <div class="controls">
        <label for="difficulty" id="difficulty-label"></label>
        <select id="difficulty"></select>
        <button id="generate"></button>
        <button id="solve"></button>
        <button id="clear"></button>
        <button id="save"></button>
        <button id="load"></button>
      </div>
    </section>

    <section class="panel board-wrap">
      <div class="board" id="board"></div>
    </section>

    <div class="status" id="status"></div>
  </main>

  <script>
    const config = {{ ui_config | tojson }};
    const gridSize = {{ grid_size }};

    const state = {
      grid: Array.from({ length: gridSize }, () => Array(gridSize).fill(0)),
      userEntered: Array.from({ length: gridSize }, () => Array(gridSize).fill(false)),
      cellColors: Array.from({ length: gridSize }, () => Array(gridSize).fill("")),
    };

    const boardEl = document.getElementById("board");
    const statusEl = document.getElementById("status");
    const difficultyEl = document.getElementById("difficulty");

    function getCell(row, col) {
      if (row < 0 || row >= gridSize || col < 0 || col >= gridSize) {
        return null;
      }
      return boardEl.querySelector(`.cell[data-row="${row}"][data-col="${col}"]`);
    }

    function moveFocus(row, col) {
      const target = getCell(row, col);
      if (target) {
        target.focus();
        target.select();
      }
    }

    function updateCellState(row, col, value, markUser = false) {
      state.grid[row][col] = value;
      state.userEntered[row][col] = markUser && value !== 0;
      state.cellColors[row][col] = value === 0 ? "" : (markUser ? config.theme.user_cell : state.cellColors[row][col]);
    }

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function applyTheme() {
      const root = document.documentElement;
      Object.entries(config.theme).forEach(([key, value]) => {
        root.style.setProperty(`--${key.replaceAll("_", "-")}`, value);
      });

      document.getElementById("title").textContent = config.labels.app_title;
      document.getElementById("subtitle").textContent = config.labels.subtitle;
      document.getElementById("difficulty-label").textContent = config.labels.difficulty;

      document.getElementById("generate").textContent = config.buttons.generate;
      document.getElementById("solve").textContent = config.buttons.solve;
      document.getElementById("clear").textContent = config.buttons.clear;
      document.getElementById("save").textContent = config.buttons.save;
      document.getElementById("load").textContent = config.buttons.load_latest;

      config.difficulty_options.forEach((name) => {
        const option = document.createElement("option");
        option.value = name;
        option.textContent = name;
        difficultyEl.appendChild(option);
      });
      difficultyEl.value = config.difficulty_options[0];
    }

    function renderBoard() {
      boardEl.innerHTML = "";

      for (let row = 0; row < gridSize; row += 1) {
        for (let col = 0; col < gridSize; col += 1) {
          const input = document.createElement("input");
          input.type = "text";
          input.inputMode = "numeric";
          input.maxLength = 1;
          input.className = "cell";
          input.dataset.row = String(row);
          input.dataset.col = String(col);

          if ((col + 1) % 3 === 0 && col !== gridSize - 1) {
            input.classList.add("thick-right");
          }
          if ((row + 1) % 3 === 0 && row !== gridSize - 1) {
            input.classList.add("thick-bottom");
          }

          input.addEventListener("input", onCellInput);
          input.addEventListener("keydown", onCellKeyDown);
          input.addEventListener("focus", () => input.select());
          boardEl.appendChild(input);
        }
      }

      syncBoardFromState();
    }

    function onCellInput(event) {
      const input = event.target;
      const row = Number(input.dataset.row);
      const col = Number(input.dataset.col);
      const value = input.value.trim();

      if (value === "") {
        updateCellState(row, col, 0, false);
        syncBoardFromState();
        return;
      }

      if (!/^[1-9]$/.test(value)) {
        input.value = "";
        updateCellState(row, col, 0, false);
        setStatus(config.labels.invalid_input);
        syncBoardFromState();
        return;
      }

      updateCellState(row, col, Number(value), true);
      syncBoardFromState();
    }

    function onCellKeyDown(event) {
      const input = event.target;
      const row = Number(input.dataset.row);
      const col = Number(input.dataset.col);
      const key = event.key;

      if (key === "ArrowUp") {
        event.preventDefault();
        moveFocus(row - 1, col);
        return;
      }
      if (key === "ArrowDown") {
        event.preventDefault();
        moveFocus(row + 1, col);
        return;
      }
      if (key === "ArrowLeft") {
        event.preventDefault();
        moveFocus(row, col - 1);
        return;
      }
      if (key === "ArrowRight") {
        event.preventDefault();
        moveFocus(row, col + 1);
        return;
      }

      if (key === "Enter") {
        event.preventDefault();
        moveFocus(event.shiftKey ? row - 1 : row + 1, col);
        return;
      }

      if (key === "Backspace" || key === "Delete") {
        event.preventDefault();
        updateCellState(row, col, 0, false);
        syncBoardFromState();
        if (key === "Backspace") {
          moveFocus(row, col - 1);
        }
        return;
      }

      if (/^[1-9]$/.test(key)) {
        event.preventDefault();
        updateCellState(row, col, Number(key), true);
        syncBoardFromState();
        moveFocus(row, col + 1);
        return;
      }

      if (key === "0" || key === ".") {
        event.preventDefault();
        updateCellState(row, col, 0, false);
        syncBoardFromState();
      }
    }

    function syncBoardFromState() {
      document.querySelectorAll(".cell").forEach((cell) => {
        const row = Number(cell.dataset.row);
        const col = Number(cell.dataset.col);
        const value = state.grid[row][col];
        const color = state.cellColors[row][col];

        cell.value = value === 0 ? "" : String(value);
        cell.style.backgroundColor = color || config.theme.entry_bg;
      });
    }

    function setFromPayload(payload, fallbackTimestamp = null) {
      state.grid = payload.grid.map((row) => row.slice());
      state.cellColors = payload.cell_colors.map((row) => row.slice());
      state.userEntered = state.grid.map((row, r) => row.map((value, c) => value !== 0 && state.cellColors[r][c] === config.theme.user_cell));
      syncBoardFromState();

      if (fallbackTimestamp) {
        setStatus(config.labels.loaded_status.replace("{timestamp}", fallbackTimestamp));
      }
    }

    async function callJson(url, options = {}) {
      const response = await fetch(url, options);
      const payload = await response.json();
      if (!response.ok) {
        throw new Error(payload.error || "Request failed");
      }
      return payload;
    }

    async function generatePuzzle() {
      const difficulty = difficultyEl.value;
      const payload = await callJson(`/generate?difficulty=${encodeURIComponent(difficulty)}`);
      setFromPayload(payload);
      setStatus(config.labels.generated_status.replace("{difficulty}", difficulty));
    }

    async function solvePuzzle() {
      const payload = await callJson("/solve", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ grid: state.grid }),
      });
      setFromPayload(payload);
      setStatus(config.labels.solved_status);
    }

    function clearGrid() {
      state.grid = Array.from({ length: gridSize }, () => Array(gridSize).fill(0));
      state.userEntered = Array.from({ length: gridSize }, () => Array(gridSize).fill(false));
      state.cellColors = Array.from({ length: gridSize }, () => Array(gridSize).fill(""));
      syncBoardFromState();
      setStatus(config.labels.cleared_status);
    }

    async function saveGrid() {
      const payload = await callJson("/save", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          grid: state.grid,
          user_entered: state.userEntered,
        }),
      });
      setStatus(config.labels.saved_status.replace("{path}", payload.path));
    }

    async function loadLatest() {
      const payload = await callJson("/load");
      setFromPayload(payload, payload.timestamp || "unknown time");
    }

    function bindActions() {
      document.getElementById("generate").addEventListener("click", () => {
        generatePuzzle().catch((error) => setStatus(error.message));
      });
      document.getElementById("solve").addEventListener("click", () => {
        solvePuzzle().catch((error) => setStatus(error.message));
      });
      document.getElementById("clear").addEventListener("click", clearGrid);
      document.getElementById("save").addEventListener("click", () => {
        saveGrid().catch((error) => setStatus(error.message));
      });
      document.getElementById("load").addEventListener("click", () => {
        loadLatest().catch((error) => setStatus(error.message));
      });
    }

    applyTheme();
    renderBoard();
    bindActions();
    setStatus(config.labels.default_status);
  </script>
</body>
</html>
